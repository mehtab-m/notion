    <!--
      Applies the saved theme before first paint. Without this the
      document renders light, then React sets data-theme on mount and
      dark-mode users see a white flash on every load.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sortlife_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
