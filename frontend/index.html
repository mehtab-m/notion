<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to a real
         value on notched phones; without it the bottom bar sat under the home
         indicator and every safe-area pad in the stylesheet was a no-op. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SortLife — Totally free forever</title>
    <meta
      name="description"
      content="SortLife keeps your notes, goals, habits, books, shows, projects and money in one calm workspace. Free forever."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0C11" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="SortLife" />
    <meta property="og:description" content="Your notes, goals, habits and projects in one calm workspace." />
    <meta property="og:type" content="website" />

    <!--
      Applies the saved appearance before first paint. Without this the
      document renders in Daylight, then React sets data-theme on mount
      and every non-default theme flashes white on load. Kept in sync
      with src/theme/catalog.js by hand — it is nine ids and a mode.
    -->
    <script>
      (function () {
        var MODES = {
          light: 'light', dark: 'dark', dim: 'dark', aurora: 'dark',
          sunset: 'light', nord: 'dark', rose: 'light', forest: 'dark',
          mono: 'light'
        };
        var root = document.documentElement;
        var state = null;

        try {
          var raw = localStorage.getItem('sortlife_appearance');
          if (raw) state = JSON.parse(raw);
          if (!state) {
            var legacy = localStorage.getItem('sortlife_theme');
            if (legacy === 'light' || legacy === 'dark') state = { themeId: legacy };
          }
        } catch (e) { /* private mode — fall back to the media query */ }

        if (!state || !state.themeId) {
          var prefersDark = window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          state = { themeId: prefersDark ? 'dark' : 'light' };
        }

        var id = state.themeId;
        var custom = null;
        if (typeof id === 'string' && id.indexOf('custom:') === 0) {
          var list = state.customThemes || [];
          for (var i = 0; i < list.length; i++) {
            if (list[i] && list[i].id === id) { custom = list[i]; break; }
          }
        }

        var base = custom ? (custom.base || 'light') : id;
        if (!MODES[base]) base = 'light';
        root.setAttribute('data-theme', base);
        root.setAttribute('data-mode', custom ? (custom.mode === 'dark' ? 'dark' : 'light') : MODES[base]);
        root.setAttribute('data-density', state.density || 'comfortable');
        root.setAttribute('data-reduced-motion', String(state.reducedMotion === true));
        root.style.setProperty('--font-scale', String((state.fontScale || 100) / 100));
        root.style.colorScheme = root.getAttribute('data-mode');

        // Collapsed-rail state, so the shell does not jump on load.
        try {
          if (localStorage.getItem('sortlife_sidebar_collapsed') === 'true') {
            root.setAttribute('data-rail', 'on');
          }
        } catch (e) { /* ignore */ }

        if (custom && custom.tokens) {
          for (var key in custom.tokens) {
            if (/^[a-z-]+$/.test(key) && /^#[0-9a-fA-F]{3,8}$/.test(custom.tokens[key])) {
              root.style.setProperty('--' + key, custom.tokens[key]);
            }
          }
        }
      })();
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SortLife" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        SortLife needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
